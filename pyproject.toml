[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonschema-dbt-overlay"
version = "0.1.0"
description = "Generate dbt staging SQL, tests, and path manifests from JSON Schema contracts."
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
